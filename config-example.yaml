# Configuration minimale pour l'agent LUMA
# Ce fichier ne contient que les informations nécessaires pour se connecter à l'API
# La configuration complète sera récupérée depuis LUMA

# Informations d'API (OBLIGATOIRES)
api:
  # URL de base de l'API LUMA (OBLIGATOIRE)
  base_url: "https://dev.mhemery.fr/api"
  
  # UUID de l'agent (OBLIGATOIRE)
  # Identifiant unique attribué à cet agent
  uuid: "00000000-0000-0000-0000-000000000000"
  
  # Token d'authentification (OBLIGATOIRE)
  # Token sécurisé pour l'authentification auprès de l'API
  token: "your-api-token-goes-here"
  
  # Timeout des requêtes en secondes (Optionnel, défaut: 30)
  timeout: 30

# REMARQUE:
# Le reste de la configuration sera téléchargée depuis LUMA
# Si aucune configuration n'existe sur LUMA, l'agent tentera d'en créer une
# avec les valeurs par défaut. Voir src/constants.py pour ces valeurs.

