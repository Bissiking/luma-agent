name: system_monitor
version: 1.0.0
description: Surveillance des ressources système avec alertes
author: Amether CORP
enabled: true

# Intervalle de vérification en secondes
check_interval: 60

# Seuils d'alerte en pourcentage
alert_thresholds:
  cpu: 80
  memory: 80
  disk: 90

# Intervalle minimum entre les alertes en secondes
alert_interval: 3600  # 1 heure

# Taille de l'historique des métriques
history_size: 100

# Permissions requises
permissions:
  - system.info
  - notifications.discord

# Webhook Discord pour les notifications
discord_webhook_url: "" 